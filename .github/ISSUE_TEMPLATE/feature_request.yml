name: Feature request
description: Suggest an improvement for Bunny Stream React Native.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to build, and what is currently hard or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, behavior, or documentation you would like to see.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - TurboModule / native modules
        - API client
        - Upload
        - Player (VOD)
        - Player (live)
        - Broadcaster
        - Codegen / spec files
        - Example app
        - Documentation
        - Build or package configuration
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there workarounds or other designs you considered?
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, or native SDK examples.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: This request is about the React Native wrapper, not the underlying native SDKs or general Bunny Stream product support.
          required: true
