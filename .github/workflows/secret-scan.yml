name: Secret scan

on:
  push:
    branches:
      - '**'
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" gitleaks

      - name: Scan incoming commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" || true)"
          fi

          if [[ -z "$BASE_SHA" ]]; then
            range="$HEAD_SHA"
          elif [[ "$BASE_SHA" == "$HEAD_SHA" ]]; then
            range="-1 $HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi

          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--diff-merges=remerge $range"
