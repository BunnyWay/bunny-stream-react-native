name: Closed-test native SDKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    outputs:
      ios_commit: ${{ steps.baselines.outputs.ios_commit }}
    steps:
      - name: Checkout wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "$GITHUB_REPOSITORY" .
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"

      - name: Read native SDK baselines
        id: baselines
        run: |
          echo "ios_commit=$(node -p "require('./native-sdk-baselines.json').ios.commit")" >> "$GITHUB_OUTPUT"

  ios:
    needs: baselines
    runs-on: macos-latest
    env:
      BUNNY_STREAM_IOS_SDK_PATH: ${{ github.workspace }}/native/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Checkout wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "$GITHUB_REPOSITORY" .
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"

      - name: Checkout pinned iOS SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone BunnyWay/bunny-stream-ios native/ios -- --no-checkout
          git -C native/ios fetch --depth=1 origin "${{ needs.baselines.outputs.ios_commit }}"
          git -C native/ios checkout --detach "${{ needs.baselines.outputs.ios_commit }}"

      - name: Setup Node.js and dependencies
        run: |
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          . "$NVM_DIR/nvm.sh"
          nvm install "$(cat .nvmrc)"
          nvm use
          corepack enable
          yarn install --immutable

      - name: Verify native SDK baseline
        run: yarn native-baselines:check ios

      - name: Install iOS dependencies
        run: yarn example setup:ios

      - name: Build iOS example
        run: yarn turbo run build:ios --cache-dir=.turbo/ios
