name: Publish to npm
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing needs npm >= 11.5.1. `yarn npm publish` does not support it.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Check tag matches package version
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Skip if version is already on npm
        id: check
        run: |
          SPEC="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          if npm view "$SPEC" version >/dev/null 2>&1; then
            echo "::notice::$SPEC is already on npm. Nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint and typecheck
        if: steps.check.outputs.published != 'true'
        run: yarn lint && yarn typecheck

      - name: Test
        if: steps.check.outputs.published != 'true'
        run: yarn test --maxWorkers=2

      - name: Build package
        if: steps.check.outputs.published != 'true'
        run: yarn prepare

      # Prerelease versions (e.g. 1.0.0-beta.1) go to the "next" dist-tag.
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          DIST_TAG=latest
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; fi
          npm publish --access public --ignore-scripts --tag "$DIST_TAG"
