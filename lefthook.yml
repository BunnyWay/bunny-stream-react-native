pre-commit:
  parallel: true
  commands:

    secrets:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --staged --redact=100 --no-banner
        fi

    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx eslint {staged_files}

    types:
      glob: "*.{js,ts, jsx, tsx}"
      run: npx tsc
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
