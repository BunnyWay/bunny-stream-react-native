buildscript {
    apply(from: {
        def searchDir = rootDir.toPath()
        do {
            def p = searchDir.resolve("node_modules/react-native-test-app/android/dependencies.gradle")
            if (p.toFile().exists()) {
                return p.toRealPath().toString()
            }
        } while (searchDir = searchDir.getParent())
        throw new GradleException("Could not find `react-native-test-app`");
    }())

    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        getReactNativeDependencies().each { dependency ->
            classpath(dependency)
        }
    }
}

// Enable core library desugaring for the :app project.
// Required by transitive deps of the Bunny Stream Android SDK
// (media3-exoplayer-ima, interactivemedia).
subprojects { subproject ->
    if (subproject.name == "app") {
        subproject.afterEvaluate {
            android {
                compileOptions {
                    coreLibraryDesugaringEnabled true
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            dependencies {
                coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
            }

            // PiP: react-native-test-app generates the main AndroidManifest.xml
            // and offers no way to set activity attributes. Patch it right
            // before the manifest merger runs so MainActivity declares
            // supportsPictureInPicture + configChanges — both required for
            // `BunnyStreamPlayerRef.enterPiP()` (the call throws without the
            // flag, and without configChanges the activity is recreated on the
            // PiP transition, killing playback).
            tasks.matching { it.name ==~ /process\w+MainManifest/ }.configureEach {
                dependsOn "generateAndroidManifest"
                doFirst {
                    def manifest = subproject.layout.buildDirectory
                        .file("generated/rnta/src/main/AndroidManifest.xml")
                        .get().asFile
                    if (manifest.exists() && !manifest.text.contains("supportsPictureInPicture")) {
                        manifest.text = manifest.text.replaceFirst(
                            /(<activity[^>]*?android:name="com\.microsoft\.reacttestapp\.MainActivity")/,
                            '$1 android:supportsPictureInPicture="true" ' +
                                'android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"'
                        )
                    }
                }
            }
        }
    }
}
